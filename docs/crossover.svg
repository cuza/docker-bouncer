<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img" aria-labelledby="t d">
  <title id="t">docker bouncer: a crossover bounce</title>
  <desc id="d">The api proxy (Envoy) sends traffic to replica api-app-1 running v1. A new replica api-app-2 running v2 starts, becomes healthy and joins Envoy's list. api-app-1 is taken off the list, finishes its in-flight requests, and is stopped and removed. v2 then serves all traffic.</desc>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --box: #f6f8fa; --line: #d1d9e0;
      --ok: #1a7f37; --warn: #9a6700; --idle: #818b98; --dot: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --box: #151b23; --line: #3d444d;
        --ok: #3fb950; --warn: #d29922; --idle: #6e7681; --dot: #4493f8;
      }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12px; fill: var(--muted); }
    .wire { stroke: var(--line); stroke-width: 2; fill: none; }
    .cap { font-size: 14px; font-weight: 500; opacity: 0; }
    .ok-rect { fill: none; stroke: var(--ok); stroke-width: 2.5; }
    .warn-rect { fill: none; stroke: var(--warn); stroke-width: 2.5; stroke-dasharray: 6 5; }
    .idle-rect { fill: none; stroke: var(--idle); stroke-width: 2.5; stroke-dasharray: 2 4; }
    .ok { fill: var(--ok); } .warn { fill: var(--warn); } .idle { fill: var(--idle); }
    .dot { fill: var(--dot); }

    /* 24 s loop. Phases: 0-16 v1 only, 16-35 v2 starting, 35-51 both listed,
       51-70 v1 draining, 70-87 v1 stopped+removed, 87-100 v2 only. */
    .a { animation-duration: 24s; animation-iteration-count: infinite; animation-timing-function: linear; }
    @keyframes c1 { 0%,15.9% { opacity: 1 } 16%,100% { opacity: 0 } }
    @keyframes c2 { 0%,15.9% { opacity: 0 } 16%,34.9% { opacity: 1 } 35%,100% { opacity: 0 } }
    @keyframes c3 { 0%,34.9% { opacity: 0 } 35%,50.9% { opacity: 1 } 51%,100% { opacity: 0 } }
    @keyframes c4 { 0%,50.9% { opacity: 0 } 51%,69.9% { opacity: 1 } 70%,100% { opacity: 0 } }
    @keyframes c5 { 0%,69.9% { opacity: 0 } 70%,86.9% { opacity: 1 } 87%,100% { opacity: 0 } }
    @keyframes c6 { 0%,86.9% { opacity: 0 } 87%,100% { opacity: 1 } }
    #c1 { animation-name: c1 } #c2 { animation-name: c2 } #c3 { animation-name: c3 }
    #c4 { animation-name: c4 } #c5 { animation-name: c5 } #c6 { animation-name: c6 }

    /* Envoy's list, as shown in the proxy box */
    #l1 { animation-name: c12 } #l12 { animation-name: c3 } #l2 { animation-name: c46 }
    @keyframes c12 { 0%,34.9% { opacity: 1 } 35%,100% { opacity: 0 } }
    @keyframes c46 { 0%,50.9% { opacity: 0 } 51%,100% { opacity: 1 } }

    /* replica 1: serving, then draining, then gone */
    @keyframes rep1 { 0% { opacity: 0 } 2%,70% { opacity: 1 } 76%,100% { opacity: 0 } }
    #rep1 { animation-name: rep1 }
    #rep1-ok, #rep1-serving { animation-name: c12b }
    #rep1-warn, #rep1-draining { animation-name: c46 }
    @keyframes c12b { 0%,50.9% { opacity: 1 } 51%,100% { opacity: 0 } }

    /* replica 2: appears starting, turns healthy */
    @keyframes rep2 { 0%,15.9% { opacity: 0 } 17%,100% { opacity: 1 } }
    #rep2 { animation-name: rep2 }
    #rep2-idle, #rep2-starting { animation-name: c2b }
    #rep2-ok, #rep2-healthy { animation-name: c3b }
    @keyframes c2b { 0%,34.9% { opacity: 1 } 35%,100% { opacity: 0 } }
    @keyframes c3b { 0%,34.9% { opacity: 0 } 35%,100% { opacity: 1 } }

    /* which routes carry new requests */
    @keyframes route1 { 0%,50.9% { opacity: 1 } 51%,100% { opacity: 0 } }
    @keyframes route2 { 0%,34.9% { opacity: 0 } 35%,100% { opacity: 1 } }
    #route1 { animation-name: route1 } #route2 { animation-name: route2 }

    /* an in-flight request finishing on the draining replica */
    @keyframes inflight { 0%,50.9% { opacity: 0 } 51%,66% { opacity: 1 } 68%,100% { opacity: 0 } }
    #inflight { animation-name: inflight }

    /* request dots travelling client -> proxy -> replica */
    .t { animation: 2.4s linear infinite; }
    .t1 { animation-name: to1 } .t2 { animation-name: to2 }
    .d2 { animation-delay: -0.8s } .d3 { animation-delay: -1.6s }
    @keyframes to1 {
      0%   { transform: translate(150px, 155px) }
      35%  { transform: translate(268px, 155px) }
      55%  { transform: translate(412px, 155px) }
      100% { transform: translate(552px, 88px) }
    }
    @keyframes to2 {
      0%   { transform: translate(150px, 155px) }
      35%  { transform: translate(268px, 155px) }
      55%  { transform: translate(412px, 155px) }
      100% { transform: translate(552px, 222px) }
    }

    #static { opacity: 0 }
    @media (prefers-reduced-motion: reduce) {
      .a, .t { animation: none !important; }
      #static { opacity: 1 }
      #route1, #route2 { opacity: 0 }
      #rep1, #rep2, #l12, #rep1-ok, #rep1-serving, #rep2-ok, #rep2-healthy { opacity: 1 }
      #l1, #l2, #rep1-warn, #rep1-draining, #rep2-idle, #rep2-starting, #inflight, .cap { opacity: 0 }
    }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="310" rx="12"/>

  <!-- wires -->
  <path class="wire" d="M150 155 H268"/>

  <!-- clients -->
  <rect class="box" x="30" y="125" width="120" height="60" rx="10"/>
  <text class="title" x="90" y="152" text-anchor="middle">clients</text>
  <text class="sub" x="90" y="170" text-anchor="middle">api:8080</text>

  <!-- proxy -->
  <rect class="box" x="268" y="112" width="144" height="86" rx="10"/>
  <text class="title" x="340" y="138" text-anchor="middle">api</text>
  <text class="sub" x="340" y="156" text-anchor="middle">Envoy proxy</text>
  <text id="l1" class="sub a" x="340" y="182" text-anchor="middle">list: app-1</text>
  <text id="l12" class="sub a" x="340" y="182" text-anchor="middle" opacity="0">list: app-1, app-2</text>
  <text id="l2" class="sub a" x="340" y="182" text-anchor="middle" opacity="0">list: app-2</text>

  <!-- replica 1 (v1) -->
  <g id="rep1" class="a">
    <path class="wire" d="M412 155 C480 155 490 88 552 88"/>
    <rect class="box" x="552" y="58" width="146" height="60" rx="10"/>
    <rect id="rep1-ok" class="ok-rect a" x="552" y="58" width="146" height="60" rx="10"/>
    <rect id="rep1-warn" class="warn-rect a" x="552" y="58" width="146" height="60" rx="10" opacity="0"/>
    <text class="title" x="625" y="84" text-anchor="middle">api-app-1 · v1</text>
    <text id="rep1-serving" class="sub a ok" x="625" y="103" text-anchor="middle">serving</text>
    <text id="rep1-draining" class="sub a warn" x="625" y="103" text-anchor="middle" opacity="0">draining</text>
    <circle id="inflight" class="dot a" cx="566" cy="88" r="5" opacity="0"/>
  </g>

  <!-- replica 2 (v2) -->
  <g id="rep2" class="a" opacity="0">
    <path class="wire" d="M412 155 C480 155 490 222 552 222"/>
    <rect class="box" x="552" y="192" width="146" height="60" rx="10"/>
    <rect id="rep2-idle" class="idle-rect a" x="552" y="192" width="146" height="60" rx="10"/>
    <rect id="rep2-ok" class="ok-rect a" x="552" y="192" width="146" height="60" rx="10" opacity="0"/>
    <text class="title" x="625" y="218" text-anchor="middle">api-app-2 · v2</text>
    <text id="rep2-starting" class="sub a idle" x="625" y="237" text-anchor="middle">starting</text>
    <text id="rep2-healthy" class="sub a ok" x="625" y="237" text-anchor="middle" opacity="0">healthy · serving</text>
  </g>

  <!-- request dots -->
  <g id="route1" class="a">
    <circle class="dot t t1" r="5"/>
    <circle class="dot t t1 d2" r="5"/>
    <circle class="dot t t1 d3" r="5"/>
  </g>
  <g id="route2" class="a" opacity="0">
    <circle class="dot t t2" r="5"/>
    <circle class="dot t t2 d2" r="5"/>
    <circle class="dot t t2 d3" r="5"/>
  </g>

  <!-- captions -->
  <text id="c1" class="cap a" x="30" y="40">1 · v1 serves all traffic</text>
  <text id="c2" class="cap a" x="30" y="40">2 · Compose starts api-app-2 (v2) next to it</text>
  <text id="c3" class="cap a" x="30" y="40">3 · healthy for min_task_uptime → added to Envoy's list</text>
  <text id="c4" class="cap a" x="30" y="40">4 · api-app-1 leaves the list; in-flight requests finish</text>
  <text id="c5" class="cap a" x="30" y="40">5 · no open connections → docker stop + rm</text>
  <text id="c6" class="cap a" x="30" y="40">6 · v2 serves all traffic. Bounce done.</text>
  <text id="static" class="cap" x="30" y="40">crossover: new replica joins before the old one drains</text>

  <text class="sub" x="30" y="290">clients never reconnect: they talk to the proxy, only the proxy's upstream list changes</text>
</svg>
