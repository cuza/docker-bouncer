name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.8" }
      - run: go vet ./...
      - run: go test ./...
      - run: docker pull envoyproxy/envoy:v1.39.1
      - run: go test -tags e2e -count=1 -timeout 20m ./test/e2e/...
